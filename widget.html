<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Widget - SMART GRADE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #0f3b48;
      --secondary: #00b4d8;
      --card-bg: #ffffff;
      --text: #1a2a3a;
      --text-light: #4a627a;
      --border: rgba(0,0,0,0.08);
      --shadow: rgba(0,0,0,0.12);
      --radius: 16px;
    }
    
    .theme-default { --primary: #0f3b48; --secondary: #00b4d8; }
    .theme-crimson { --primary: #c0392b; --secondary: #ff4757; }
    .theme-forest { --primary: #1e8449; --secondary: #2ecc71; }
    .theme-ocean { --primary: #006994; --secondary: #00b4d8; }
    .theme-royal { --primary: #6c3483; --secondary: #a569bd; }
    .theme-sunset { --primary: #d35400; --secondary: #f39c12; }
    .theme-rose { --primary: #c44569; --secondary: #fd79a8; }
    .theme-turquoise { --primary: #00897b; --secondary: #1de9b6; }
    .theme-amber { --primary: #b7950b; --secondary: #f1c40f; }
    .theme-graphite { --primary: #455a64; --secondary: #90a4ae; }
    .theme-lavender { --primary: #7b1fa2; --secondary: #ce93d8; }
    .theme-cherry { --primary: #b71c1c; --secondary: #ef5350; }
    .theme-midnight { --primary: #1a237e; --secondary: #5c6bc0; }
    .theme-mint { --primary: #00b894; --secondary: #55efc4; }
    .theme-coral { --primary: #e74c3c; --secondary: #ff6b6b; }
    .theme-indigo { --primary: #283593; --secondary: #7986cb; }
    .theme-chocolate { --primary: #5d4037; --secondary: #a1887f; }
    .theme-electric { --primary: #6a1b9a; --secondary: #e040fb; }
    .theme-steel { --primary: #37474f; --secondary: #78909c; }
    .theme-lime { --primary: #558b2f; --secondary: #aed581; }
    
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: transparent;
      padding: 0;
      margin: 0;
    }
    
    .widget-container {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 18px 16px;
      width: 100%;
      max-width: 220px;
      margin: 0 auto;
      box-shadow: 0 8px 32px var(--shadow);
      border: 1px solid var(--border);
      animation: fadeIn 0.5s ease;
      transition: border-color 0.5s ease;
    }
    
    .widget-container:hover {
      border-color: var(--primary);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    
    .widget-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
      transition: border-color 0.5s ease;
    }
    
    .widget-header .icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.5s ease;
    }
    
    .widget-header .icon i {
      font-size: 14px;
      color: white;
    }
    
    .widget-header h4 {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    
    .widget-header .version {
      margin-left: auto;
      font-size: 0.45rem;
      color: var(--text-light);
      background: rgba(0,0,0,0.04);
      padding: 2px 8px;
      border-radius: 20px;
    }
    
    .widget-grade {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px;
      font-size: 0.7rem;
      color: var(--text-light);
      border-bottom: 1px solid var(--border);
      transition: border-color 0.5s ease;
    }
    
    .widget-grade:last-of-type {
      border-bottom: none;
    }
    
    .widget-grade .label {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .widget-grade .label i {
      font-size: 0.55rem;
      color: var(--primary);
      width: 14px;
      transition: color 0.5s ease;
    }
    
    .widget-grade .value {
      font-weight: 700;
      color: var(--primary);
      font-size: 0.75rem;
      transition: color 0.5s ease;
    }
    
    .widget-grade .value.high { color: #2ecc71; }
    .widget-grade .value.medium { color: #f39c12; }
    .widget-grade .value.low { color: #e74c3c; }
    
    .widget-total {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 2px solid var(--border);
      text-align: center;
      transition: border-color 0.5s ease;
    }
    
    .widget-total .avg {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
      transition: color 0.5s ease;
    }
    
    .widget-total .avg-label {
      font-size: 0.5rem;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }
    
    .widget-total .status {
      font-size: 0.5rem;
      font-weight: 600;
      margin-top: 4px;
      padding: 2px 10px;
      border-radius: 20px;
      display: inline-block;
      transition: all 0.5s ease;
    }
    
    .widget-total .status.excellent {
      background: rgba(46,204,113,0.15);
      color: #2ecc71;
    }
    
    .widget-total .status.good {
      background: rgba(52,152,219,0.15);
      color: #3498db;
    }
    
    .widget-total .status.average {
      background: rgba(243,156,18,0.15);
      color: #f39c12;
    }
    
    .widget-total .status.needs {
      background: rgba(231,76,60,0.15);
      color: #e74c3c;
    }
    
    .widget-footer {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.45rem;
      color: var(--text-light);
      transition: border-color 0.5s ease;
    }
    
    .widget-footer .grades-count i { margin-right: 3px; }
    .widget-footer .update-time i { margin-right: 3px; }
    
    .spinner-sm {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(0,0,0,0.1);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 0.6s linear infinite;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* ============================================
       TOAST SYSTEM - 20 COULEURS
       ============================================ */
    .toast-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      animation: overlayIn 0.3s ease;
    }
    
    .toast-overlay.show { display: flex; }
    
    @keyframes overlayIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .toast-box {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 32px 28px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      border: 2px solid var(--border);
      box-shadow: 0 30px 80px rgba(0,0,0,0.3);
      animation: boxIn 0.4s ease;
      position: relative;
      overflow: hidden;
    }
    
    .toast-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      transition: background 0.5s ease;
    }
    
    @keyframes boxIn {
      from { opacity: 0; transform: scale(0.9) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    
    .toast-box .toast-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px;
      color: white;
      transition: background 0.5s ease;
    }
    
    .toast-default { background: linear-gradient(135deg, #0f3b48, #00b4d8); }
    .toast-crimson { background: linear-gradient(135deg, #c0392b, #ff4757); }
    .toast-forest { background: linear-gradient(135deg, #1e8449, #2ecc71); }
    .toast-ocean { background: linear-gradient(135deg, #006994, #00b4d8); }
    .toast-royal { background: linear-gradient(135deg, #6c3483, #a569bd); }
    .toast-sunset { background: linear-gradient(135deg, #d35400, #f39c12); }
    .toast-rose { background: linear-gradient(135deg, #c44569, #fd79a8); }
    .toast-turquoise { background: linear-gradient(135deg, #00897b, #1de9b6); }
    .toast-amber { background: linear-gradient(135deg, #b7950b, #f1c40f); }
    .toast-graphite { background: linear-gradient(135deg, #455a64, #90a4ae); }
    .toast-lavender { background: linear-gradient(135deg, #7b1fa2, #ce93d8); }
    .toast-cherry { background: linear-gradient(135deg, #b71c1c, #ef5350); }
    .toast-midnight { background: linear-gradient(135deg, #1a237e, #5c6bc0); }
    .toast-mint { background: linear-gradient(135deg, #00b894, #55efc4); }
    .toast-coral { background: linear-gradient(135deg, #e74c3c, #ff6b6b); }
    .toast-indigo { background: linear-gradient(135deg, #283593, #7986cb); }
    .toast-chocolate { background: linear-gradient(135deg, #5d4037, #a1887f); }
    .toast-electric { background: linear-gradient(135deg, #6a1b9a, #e040fb); }
    .toast-steel { background: linear-gradient(135deg, #37474f, #78909c); }
    .toast-lime { background: linear-gradient(135deg, #558b2f, #aed581); }
    
    .toast-box .toast-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    
    .toast-box .toast-message {
      font-size: 0.8rem;
      color: var(--text-light);
      line-height: 1.5;
      margin-bottom: 20px;
    }
    
    .toast-box .toast-btn {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      padding: 10px 32px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.25s ease;
      min-width: 120px;
    }
    
    .toast-box .toast-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(15,59,72,0.25);
    }
    
    .toast-box .toast-btn:active { transform: scale(0.95); }
    
    .toast-box .toast-emoji {
      font-size: 3rem;
      display: block;
      margin-bottom: 8px;
    }
    
    .toast-box .toast-tag {
      display: inline-block;
      font-size: 0.55rem;
      font-weight: 600;
      padding: 2px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      background: rgba(0,0,0,0.05);
      color: var(--text-light);
    }
    
    @media (max-width: 480px) {
      .widget-container { max-width: 180px; padding: 14px 12px; }
      .widget-total .avg { font-size: 1.2rem; }
      .widget-grade { font-size: 0.6rem; padding: 4px 2px; }
      .toast-box { padding: 24px 20px; }
      .toast-box .toast-icon { width: 56px; height: 56px; font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="widget-container" id="widgetContainer">
    <div class="widget-header">
      <div class="icon" id="widgetIcon">
        <i class="fas fa-graduation-cap"></i>
      </div>
      <h4>SMART GRADE</h4>
      <span class="version">v5.0</span>
    </div>
    
    <div id="widgetContent">
      <div style="text-align:center;padding:20px;font-size:0.6rem;color:var(--text-light);">
        <div class="spinner-sm"></div>
        Loading...
      </div>
    </div>
    
    <div class="widget-footer">
      <span class="grades-count" id="gradesCount"><i class="fas fa-pen"></i> 0</span>
      <span class="update-time" id="updateTime"><i class="fas fa-clock"></i> --:--</span>
    </div>
  </div>

  <!-- TOAST SYSTEM -->
  <div class="toast-overlay" id="toastOverlay">
    <div class="toast-box" id="toastBox">
      <span class="toast-emoji" id="toastEmoji">✅</span>
      <div class="toast-icon" id="toastIcon"><i class="fas fa-check"></i></div>
      <span class="toast-tag" id="toastTag">SMART GRADE</span>
      <div class="toast-title" id="toastTitle">Success!</div>
      <div class="toast-message" id="toastMessage">Widget updated.</div>
      <button class="toast-btn" id="toastBtn" onclick="closeToast()">OK</button>
    </div>
  </div>

  <script>
    // ============================================================
    //  20 COULEURS OFFICIELLES
    // ============================================================
    
    var SMART_THEMES = [
      { name: 'default', primary: '#0f3b48', secondary: '#00b4d8', class: 'toast-default' },
      { name: 'crimson', primary: '#c0392b', secondary: '#ff4757', class: 'toast-crimson' },
      { name: 'forest', primary: '#1e8449', secondary: '#2ecc71', class: 'toast-forest' },
      { name: 'ocean', primary: '#006994', secondary: '#00b4d8', class: 'toast-ocean' },
      { name: 'royal', primary: '#6c3483', secondary: '#a569bd', class: 'toast-royal' },
      { name: 'sunset', primary: '#d35400', secondary: '#f39c12', class: 'toast-sunset' },
      { name: 'rose', primary: '#c44569', secondary: '#fd79a8', class: 'toast-rose' },
      { name: 'turquoise', primary: '#00897b', secondary: '#1de9b6', class: 'toast-turquoise' },
      { name: 'amber', primary: '#b7950b', secondary: '#f1c40f', class: 'toast-amber' },
      { name: 'graphite', primary: '#455a64', secondary: '#90a4ae', class: 'toast-graphite' },
      { name: 'lavender', primary: '#7b1fa2', secondary: '#ce93d8', class: 'toast-lavender' },
      { name: 'cherry', primary: '#b71c1c', secondary: '#ef5350', class: 'toast-cherry' },
      { name: 'midnight', primary: '#1a237e', secondary: '#5c6bc0', class: 'toast-midnight' },
      { name: 'mint', primary: '#00b894', secondary: '#55efc4', class: 'toast-mint' },
      { name: 'coral', primary: '#e74c3c', secondary: '#ff6b6b', class: 'toast-coral' },
      { name: 'indigo', primary: '#283593', secondary: '#7986cb', class: 'toast-indigo' },
      { name: 'chocolate', primary: '#5d4037', secondary: '#a1887f', class: 'toast-chocolate' },
      { name: 'electric', primary: '#6a1b9a', secondary: '#e040fb', class: 'toast-electric' },
      { name: 'steel', primary: '#37474f', secondary: '#78909c', class: 'toast-steel' },
      { name: 'lime', primary: '#558b2f', secondary: '#aed581', class: 'toast-lime' }
    ];
    
    var TOAST_EMOJIS = ['✅', '🎉', '✨', '🌟', '💪', '🚀', '🔥', '⭐', '👏', '🎯', '📚', '💡', '🌈', '🎊'];
    var TOAST_TITLES = {
      success: ['Success!', 'Done!', 'Perfect!', 'Great!', 'Awesome!', 'Amazing!'],
      error: ['Oops!', 'Error!', 'Something went wrong!', 'Try again!'],
      info: ['Info', 'Heads up!', 'Note', 'Quick tip'],
      warning: ['Warning', 'Careful!', 'Hold on!']
    };
    
    var lastThemeIndex = -1;
    
    function getRandomTheme() {
      var index;
      do {
        index = Math.floor(Math.random() * SMART_THEMES.length);
      } while (index === lastThemeIndex && SMART_THEMES.length > 1);
      lastThemeIndex = index;
      return SMART_THEMES[index];
    }
    
    function getRandomEmoji() {
      return TOAST_EMOJIS[Math.floor(Math.random() * TOAST_EMOJIS.length)];
    }
    
    function getRandomTitle(type) {
      var list = TOAST_TITLES[type] || TOAST_TITLES.success;
      return list[Math.floor(Math.random() * list.length)];
    }
    
    function applyRandomTheme() {
      var theme = getRandomTheme();
      var container = document.getElementById('widgetContainer');
      var icon = document.getElementById('widgetIcon');
      var body = document.body;
      
      container.style.setProperty('--primary', theme.primary);
      container.style.setProperty('--secondary', theme.secondary);
      icon.style.background = 'linear-gradient(135deg, ' + theme.primary + ', ' + theme.secondary + ')';
      
      return theme;
    }
    
    // ============================================================
    //  TOAST SYSTEM
    // ============================================================
    
    function showToast(type, message, redirectUrl) {
      var overlay = document.getElementById('toastOverlay');
      var icon = document.getElementById('toastIcon');
      var emoji = document.getElementById('toastEmoji');
      var title = document.getElementById('toastTitle');
      var msg = document.getElementById('toastMessage');
      var btn = document.getElementById('toastBtn');
      var tag = document.getElementById('toastTag');
      var box = document.getElementById('toastBox');
      
      var theme = getRandomTheme();
      icon.className = 'toast-icon ' + theme.class;
      box.style.setProperty('--primary', theme.primary);
      box.style.setProperty('--secondary', theme.secondary);
      
      emoji.innerHTML = getRandomEmoji();
      
      var iconMap = {
        success: 'fa-check-circle',
        error: 'fa-exclamation-circle',
        info: 'fa-info-circle',
        warning: 'fa-exclamation-triangle'
      };
      icon.innerHTML = '<i class="fas ' + (iconMap[type] || 'fa-check-circle') + '"></i>';
      
      title.innerHTML = getRandomTitle(type);
      
      var tagMap = {
        success: '✨ SMART GRADE',
        error: '⚠️ SMART GRADE',
        info: 'ℹ️ SMART GRADE',
        warning: '🔔 SMART GRADE'
      };
      tag.innerHTML = tagMap[type] || 'SMART GRADE';
      
      msg.innerHTML = message;
      
      if (redirectUrl) {
        btn.innerHTML = 'Continue <i class="fas fa-arrow-right"></i>';
        btn.onclick = function() {
          closeToast();
          setTimeout(function() { window.location.href = redirectUrl; }, 200);
        };
      } else {
        btn.innerHTML = 'OK';
        btn.onclick = closeToast;
      }
      
      overlay.classList.add('show');
      document.body.style.overflow = 'hidden';
    }
    
    function closeToast() {
      var overlay = document.getElementById('toastOverlay');
      overlay.classList.remove('show');
      document.body.style.overflow = '';
    }
    
    document.getElementById('toastOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeToast();
    });
    
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeToast();
    });

    // ============================================================
    //  WIDGET LOGIC
    // ============================================================
    
    function getCurrentStudent() {
      try {
        var stored = localStorage.getItem('smartgrade_current');
        return stored ? JSON.parse(stored) : null;
      } catch(e) { return null; }
    }

    function calculateTermAverage(userId, term) {
      try {
        var grades = JSON.parse(localStorage.getItem('smartgrade_grades_' + userId) || '[]');
        var selected = JSON.parse(localStorage.getItem('smartgrade_selected_' + userId + '_term' + term) || '[]');
        var coeffs = JSON.parse(localStorage.getItem('smartgrade_coeffs_' + userId) || '{}');
        
        if (!selected || selected.length === 0) return 0;
        
        var totalWeighted = 0;
        var totalCoeff = 0;
        var seq1 = (term - 1) * 2 + 1;
        var seq2 = seq1 + 1;
        
        for (var i = 0; i < selected.length; i++) {
          var subjectId = selected[i];
          var coeff = coeffs[subjectId] || 5;
          
          var n1 = grades.filter(function(g) { return g.subjectId === subjectId && g.sequenceId === seq1; });
          var n2 = grades.filter(function(g) { return g.subjectId === subjectId && g.sequenceId === seq2; });
          
          var a1 = 0;
          if (n1.length > 0) {
            var sum1 = 0;
            for (var j = 0; j < n1.length; j++) sum1 += n1[j].value;
            a1 = sum1 / n1.length;
          }
          
          var a2 = 0;
          if (n2.length > 0) {
            var sum2 = 0;
            for (var j = 0; j < n2.length; j++) sum2 += n2[j].value;
            a2 = sum2 / n2.length;
          }
          
          var subjectAvg = (a1 + a2) / 2;
          totalWeighted += subjectAvg * coeff;
          totalCoeff += coeff;
        }
        
        return totalCoeff > 0 ? Math.round((totalWeighted / totalCoeff) * 100) / 100 : 0;
      } catch(e) {
        return 0;
      }
    }

    function getStatusText(avg) {
      if (avg >= 16) return { text: 'Excellent', class: 'excellent' };
      if (avg >= 14) return { text: 'Very Good', class: 'good' };
      if (avg >= 12) return { text: 'Good', class: 'good' };
      if (avg >= 10) return { text: 'Average', class: 'average' };
      return { text: 'Needs Work', class: 'needs' };
    }

    function getGradeClass(avg) {
      if (avg >= 16) return 'high';
      if (avg >= 14) return 'medium';
      if (avg >= 12) return 'medium';
      if (avg >= 10) return 'medium';
      return 'low';
    }

    function loadWidgetData() {
      var user = getCurrentStudent();
      var container = document.getElementById('widgetContent');
      
      if (!user) {
        container.innerHTML = '<div style="text-align:center;padding:20px;font-size:0.6rem;color:var(--text-light);">Please login</div>';
        document.getElementById('gradesCount').innerHTML = '<i class="fas fa-pen"></i> 0';
        document.getElementById('updateTime').innerHTML = '<i class="fas fa-clock"></i> --:--';
        return;
      }
      
      var grades = JSON.parse(localStorage.getItem('smartgrade_grades_' + user.id) || '[]');
      
      var t1 = calculateTermAverage(user.id, 1);
      var t2 = calculateTermAverage(user.id, 2);
      var t3 = calculateTermAverage(user.id, 3);
      var yearly = Math.round(((t1 + t2 + t3) / 3) * 100) / 100;
      
      var status = getStatusText(yearly);
      var gradeClass = getGradeClass(yearly);
      
      var html = '';
      html += '<div class="widget-grade"><span class="label"><i class="fas fa-1"></i> Term 1</span><span class="value ' + gradeClass + '">' + (t1 > 0 ? t1.toFixed(1) : '--') + '</span></div>';
      html += '<div class="widget-grade"><span class="label"><i class="fas fa-2"></i> Term 2</span><span class="value ' + gradeClass + '">' + (t2 > 0 ? t2.toFixed(1) : '--') + '</span></div>';
      html += '<div class="widget-grade"><span class="label"><i class="fas fa-3"></i> Term 3</span><span class="value ' + gradeClass + '">' + (t3 > 0 ? t3.toFixed(1) : '--') + '</span></div>';
      html += '<div class="widget-total"><div class="avg">' + yearly.toFixed(1) + '</div><div class="avg-label">Yearly Avg</div><span class="status ' + status.class + '">' + status.text + '</span></div>';
      
      container.innerHTML = html;
      
      document.getElementById('gradesCount').innerHTML = '<i class="fas fa-pen"></i> ' + grades.length;
      
      var now = new Date();
      var timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
      document.getElementById('updateTime').innerHTML = '<i class="fas fa-clock"></i> ' + timeStr;
    }

    // ============================================================
    //  INIT
    // ============================================================
    
    applyRandomTheme();
    loadWidgetData();
    
    // Mettre à jour toutes les 30 secondes
    setInterval(loadWidgetData, 30000);
    
    // Mettre à jour quand la page revient au premier plan
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) {
        loadWidgetData();
      }
    });
  </script>
</body>
</html>
